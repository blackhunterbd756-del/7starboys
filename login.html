
<!DOCTYPE html>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#070914;--cyan:#00e5ff;--purple:#9b4dff;--text:#f4f7ff;--muted:#aab5ca}
body{min-height:100vh;background:radial-gradient(circle at 15% 30%,#073b5740,transparent 35%),radial-gradient(circle at 85% 80%,#571c7840,transparent 35%),var(--bg);color:var(--text);font-family:Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:25px;overflow-x:hidden}
.page{width:100%;max-width:1050px;display:grid;grid-template-columns:1fr 420px;align-items:center;gap:45px}
.scene{position:relative;min-height:460px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.scene-title{position:absolute;top:15px;left:10px;color:var(--cyan);letter-spacing:4px;font-size:13px}
 .character{width:100%;max-width:420px;position:relative;z-index:2;animation:characterIn 1.2s ease both,float 4s ease-in-out infinite 1.2s;filter:drop-shadow(0 18px 28px #0009)}
.person{transform-origin:285px 230px;animation:aim 3.2s ease-in-out infinite}
.weapon{transform-origin:320px 195px;animation:recoil 3.2s ease-in-out infinite}
@keyframes aim{0%,100%{transform:translateY(0) rotate(0)}48%,56%{transform:translateY(-2px) rotate(-.6deg)}}
@keyframes recoil{0%,46%,62%,100%{transform:translate(0,0)}49%{transform:translate(-5px,2px)}53%{transform:translate(1px,-1px)}}
.impact{position:absolute;right:3%;top:44%;width:22px;height:22px;border-radius:50%;background:#ff526d;filter:blur(2px);opacity:0;box-shadow:0 0 18px 9px #ff526d;animation:impact 3.2s infinite;z-index:4}
@keyframes impact{0%,48%,100%{opacity:0;transform:scale(.2)}51%{opacity:.95;transform:scale(1.6)}58%{opacity:0;transform:scale(3.2)}}
@keyframes characterIn{from{opacity:0;transform:translateX(-70px)}to{opacity:1;transform:translateX(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.energy{position:absolute;width:0;height:5px;right:3%;top:48%;border-radius:20px;background:linear-gradient(90deg,#fff,#00e5ff,#9b4dff,transparent);box-shadow:0 0 12px #00e5ff,0 0 30px #00e5ff;animation:fire 2.7s infinite;z-index:3}
.energy:after{content:"";position:absolute;width:20px;height:20px;right:0;top:-8px;border-radius:50%;background:#fff;box-shadow:0 0 20px 8px #00e5ff}
@keyframes fire{0%,20%,100%{width:0;opacity:0}22%{width:0;opacity:1}30%{width:65%;opacity:1}37%{width:0;opacity:0}65%{width:0;opacity:0}68%{width:55%;opacity:1}74%{width:0;opacity:0}}
.flash{position:absolute;right:5%;top:42%;width:55px;height:55px;border-radius:50%;background:#00e5ff;filter:blur(30px);opacity:0;animation:flash 2.7s infinite}
@keyframes flash{0%,20%,100%{opacity:0}25%{opacity:.9}38%{opacity:0}68%{opacity:.7}76%{opacity:0}}
.scene-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:#00e5ff;filter:blur(100px);opacity:.12}
.login-card{position:relative;padding:35px 28px;border:1px solid #24516b;border-radius:22px;background:linear-gradient(145deg,#121c32ee,#0b1020f5);box-shadow:0 0 40px #00e5ff12,0 20px 70px #0008;backdrop-filter:blur(18px);animation:cardIn 1s ease both}
@keyframes cardIn{from{opacity:0;transform:translateY(35px)}to{opacity:1;transform:translateY(0)}}
.logo{text-align:center;color:var(--cyan);font-size:30px;font-weight:1000;letter-spacing:3px;text-shadow:0 0 18px #00e5ff90}
.subtitle{text-align:center;color:var(--muted);margin-top:10px;font-size:14px}
.line{width:65px;height:3px;margin:20px auto 28px;border-radius:5px;background:linear-gradient(90deg,var(--cyan),var(--purple));box-shadow:0 0 12px var(--cyan)}
label{display:block;font-size:13px;color:#cbd5e8;margin:16px 0 8px}
input{width:100%;padding:15px;border:1px solid #34435c;border-radius:10px;outline:none;background:#080e1c;color:white;font-size:15px;transition:.3s}
input:focus{border-color:var(--cyan);box-shadow:0 0 15px #00e5ff30}
input::placeholder{color:#758198}
button{width:100%;padding:15px;margin-top:23px;border:0;border-radius:10px;background:linear-gradient(100deg,#00cce8,#00e5ff);color:#061018;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 0 20px #00e5ff35;transition:.3s}
button:hover{transform:translateY(-3px);box-shadow:0 0 30px #00e5ff80}
button:disabled{opacity:.65;cursor:not-allowed;transform:none}
.spinner{display:none;width:17px;height:17px;margin-right:8px;vertical-align:middle;border:2px solid #07121a55;border-top-color:#07121a;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
button.loading .spinner{display:inline-block}
#message{min-height:22px;margin-top:16px;text-align:center;font-size:13px;line-height:1.7;overflow-wrap:anywhere}
#message.error{color:#ff6b82}
#message.success{color:#48ffc1}
#message.info{color:var(--cyan)}
.register{text-align:center;margin-top:22px;color:var(--muted);font-size:14px}
.register a{color:var(--cyan);text-decoration:none;font-weight:bold}
.register a:hover{text-decoration:underline}
.back{display:block;text-align:center;margin-top:20px;color:#8491a9;text-decoration:none;font-size:13px}
.back:hover{color:var(--cyan)}
@media(max-width:800px){.page{max-width:430px;grid-template-columns:1fr;gap:8px}.scene{min-height:210px}.scene-title{top:5px;left:0;right:0;text-align:center}.character{max-width:230px}.energy{top:50%;right:4%}.flash{top:43%}.impact{top:44%;right:4%}.login-card{padding:30px 23px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
<style id="auth-layout-correction">

.page{width:min(1120px,100%)!important;max-width:1120px!important;grid-template-columns:minmax(0,1.08fr) minmax(340px,.82fr)!important;gap:clamp(22px,4vw,56px)!important;align-items:center!important;margin:auto!important}

.scene:before{content:"";position:absolute;inset:10% 8%;border:1px solid rgba(232,199,123,.14);border-radius:26px;box-shadow:0 0 90px rgba(84,231,242,.08),inset 0 0 90px rgba(84,231,242,.04)}
.scene:after{content:"7STARBOYS";position:absolute;left:8%;right:8%;top:42%;text-align:center;font-size:clamp(38px,5vw,68px);font-weight:950;letter-spacing:.12em;color:#f0d99a;text-shadow:0 8px 35px rgba(232,199,123,.22)}
.scene-title{z-index:2;top:30px!important;left:30px!important;color:#d7e5ef!important;font-size:11px!important;letter-spacing:.2em!important}
.cinematic-figure,.energy,.flash,.impact{display:none!important}
.scene-glow{width:260px!important;height:260px!important;bottom:6%!important;left:calc(50% - 130px)!important;opacity:.18!important}
.login-card{width:100%!important;max-width:460px!important;padding:clamp(26px,3.5vw,42px)!important;border-radius:26px!important}
.login-card .logo{font-size:clamp(27px,3vw,34px)!important;letter-spacing:.12em!important}.login-card .subtitle{font-size:13px!important;letter-spacing:.12em!important}
.login-card label{font-size:14px!important;margin-top:19px!important}.login-card input{min-height:52px!important;padding:15px 16px!important;font-size:16px!important}.login-card button{min-height:54px!important;font-size:15px!important}
.register,.back{font-size:14px!important;line-height:1.8!important}
@media(max-width:800px){body{padding:20px 14px 30px!important;align-items:flex-start!important}.page{display:flex!important;flex-direction:column!important;gap:14px!important;width:100%!important;max-width:480px!important;margin:0 auto!important}.scene{width:100%!important;min-height:112px!important;height:112px!important;border-radius:20px!important}.scene:before{inset:8px!important;border-radius:14px!important}.scene:after{top:39%!important;font-size:clamp(25px,8vw,34px)!important;letter-spacing:.1em!important}.scene-title{top:12px!important;left:0!important;right:0!important;text-align:center!important;font-size:9px!important;letter-spacing:.14em!important}.scene-glow{width:150px!important;height:80px!important;bottom:-15px!important;left:calc(50% - 75px)!important;filter:blur(45px)!important}.login-card{max-width:none!important;padding:27px 21px!important;border-radius:22px!important}.login-card .line{margin:16px auto 20px!important}.login-card label{margin-top:16px!important}}
@media(prefers-reduced-motion:reduce){.login-card{animation:none!important}}
</style>

<body>
<main class="page">

<section class="scene">
<div class="scene-title">✦ 7STARBOYS • MEMBER ACCESS ✦</div>
<div class="scene-glow"></div>

<div class="cinematic-figure" aria-hidden="true"><span class="figure-light"></span><span class="figure-beam"></span></div>

<div class="energy"></div>
<div class="flash"></div>
<div class="impact" aria-hidden="true"></div>
</section>

<section class="login-card">
<h1 class="logo">7STARBOYS</h1>
<p class="subtitle">OFFICIAL MEMBER LOGIN</p>
<div class="line"></div>

<form id="loginForm">
<label for="email">ইমেইল ঠিকানা</label>
<input id="email" type="email" placeholder="আপনার Gmail লিখুন" autocomplete="username" required>

<label for="password">পাসওয়ার্ড</label>
<input id="password" type="password" placeholder="আপনার পাসওয়ার্ড লিখুন" autocomplete="current-password" required>

<button id="loginBtn" type="submit">
<span class="spinner"></span>
<span id="buttonText">LOGIN NOW ↗</span>
</button>
</form>

<p id="message" aria-live="polite"></p>
<div class="register">অ্যাকাউন্ট নেই? <a href="register.html">নতুন সদস্য নিবন্ধন করুন</a></div>
<a class="back" href="index.html">← হোম পেজে ফিরে যান</a>
</section>
</main>

<script type="module">
import {initializeApp,getApps} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 setPersistence,
 browserLocalPersistence,
 signInWithEmailAndPassword,
 signOut
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 getDoc
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCHveS2kKQztiMAPPhXryVNFrElEvehFs4",
 authDomain:"starboys-7539f.firebaseapp.com",
 projectId:"starboys-7539f",
 storageBucket:"starboys-7539f.firebasestorage.app",
 messagingSenderId:"542462403066",
 appId:"1:542462403066:web:a6e204f3402b72cdecc443",
 measurementId:"G-RES9E2QY2N"
};

// আলাদা নাম ব্যবহার করে Firebase App-এর সংঘর্ষ এড়ানো
const app=getApps().find(item=>item.name==="7STARBOYS_LOGIN")
 || initializeApp(firebaseConfig,"7STARBOYS_LOGIN");
const auth=getAuth(app);
const db=getFirestore(app);

const form=document.getElementById("loginForm");
const message=document.getElementById("message");
const button=document.getElementById("loginBtn");
const buttonText=document.getElementById("buttonText");

function showMessage(text,type){
 message.textContent=text;
 message.className=type;
}

let submitting=false;

form.addEventListener("submit",async(e)=>{
 e.preventDefault();

 if(submitting)return;

 submitting=true;
 button.disabled=true;
 button.classList.add("loading");
 buttonText.textContent="লগইন হচ্ছে...";
 showMessage("আপনার তথ্য যাচাই করা হচ্ছে...","info");

 try{
  await setPersistence(auth,browserLocalPersistence);

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  const result=await signInWithEmailAndPassword(auth,email,password);

  const memberSnap=await getDoc(doc(db,"members",result.user.uid));

  if(!memberSnap.exists()){
   await signOut(auth);
   throw new Error("সদস্যের তথ্য পাওয়া যায়নি।");
  }

  if(memberSnap.data().status!=="approved"){
   await signOut(auth);
   throw new Error("অ্যাডমিনের অনুমোদনের অপেক্ষায় আছেন।");
  }

  showMessage("✓ লগইন সফল! Dashboard-এ নেওয়া হচ্ছে...","success");
  buttonText.textContent="SUCCESS ✓";

  window.location.replace("member.html");

 }catch(error){
  console.error("Login error:",error);

  let errorText="আবার চেষ্টা করুন।";

  if(error.code==="auth/api-key-not-valid.-please-pass-a-valid-api-key."){
   errorText="Firebase API Key গ্রহণ করছে না। Firebase Console-এর Key যাচাই প্রয়োজন।";
  }else if(error.code==="auth/invalid-credential"||error.code==="auth/wrong-password"||error.code==="auth/user-not-found"){
   errorText="ইমেইল অথবা পাসওয়ার্ড সঠিক নয়।";
  }else if(error.code==="auth/invalid-email"){
   errorText="সঠিক ইমেইল ঠিকানা লিখুন।";
  }else if(error.code==="auth/too-many-requests"){
   errorText="অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে চেষ্টা করুন।";
  }else if(error.code==="auth/network-request-failed"){
   errorText="ইন্টারনেট সংযোগ পরীক্ষা করে আবার চেষ্টা করুন।";
  }else if(error.code==="auth/unauthorized-domain"){
   errorText="এই ওয়েবসাইট Firebase-এ অনুমোদিত নয়।";
  }else if(error.code==="permission-denied"||error.code==="firestore/permission-denied"){
   errorText="সদস্যের তথ্য যাচাই করা যাচ্ছে না।";
  }else if(error.message){
   errorText=error.message;
  }

  showMessage("সমস্যা: "+errorText,"error");
  buttonText.textContent="LOGIN NOW ↗";

 }finally{
  submitting=false;
  button.disabled=false;
  button.classList.remove("loading");
 }
});
</script>
</body>
