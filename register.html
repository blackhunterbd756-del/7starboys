
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>7STARBOYS Registration</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#101010;color:white;font-family:Arial}
.box{max-width:430px;margin:35px auto;background:#1d1d1d;padding:24px;border-radius:12px;border:1px solid #444}
h1{text-align:center;color:#f11}
p{text-align:center;color:#aaa}
input{width:100%;padding:13px;margin:10px 0;background:#101010;color:white;border:1px solid #555;border-radius:6px}
button{width:100%;padding:14px;background:#e00000;color:white;border:0;border-radius:7px;font-size:17px;font-weight:bold}
button:disabled{opacity:.6}
#message{color:#ff5555;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="box">
<h1>7STARBOYS</h1>
<p>সদস্য হওয়ার জন্য রেজিস্ট্রেশন করুন</p>

<form id="registerForm">
<input id="name" placeholder="আপনার পুরো নাম" required>
<input id="email" type="email" placeholder="আপনার Gmail" required>
<label>জন্মতারিখ</label>
<input id="birthDate" type="date" required>
<input id="password" type="password" placeholder="পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)" minlength="6" required>
<button id="submitBtn" type="submit">রেজিস্ট্রেশন করুন</button>
</form>

<p id="message"></p>
<p>আগে অ্যাকাউন্ট আছে? <a href="login.html" style="color:red">লগইন করুন</a></p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 setPersistence,
 browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCHveS2kKQztiMAPPhXryVNFrElEvehFs4",
 authDomain: "starboys-7539f.firebaseapp.com",
 projectId: "starboys-7539f",
 storageBucket: "starboys-7539f.firebasestorage.app",
 messagingSenderId: "542462403066",
 appId: "1:542462403066:web:a6e204f3402b72cdecc443",
 measurementId: "G-RES9E2QY2N"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
 e.preventDefault();
 button.disabled = true;
 message.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";

 const name = document.getElementById("name").value.trim();
 const email = document.getElementById("email").value.trim();
 const birthDate = document.getElementById("birthDate").value;
 const password = document.getElementById("password").value;

 try {
  await setPersistence(auth, browserLocalPersistence);

  const result = await createUserWithEmailAndPassword(
   auth, email, password
  );

  await setDoc(doc(db, "members", result.user.uid), {
   name: name,
   email: email,
   birthDate: birthDate,
   status: "pending",
   createdAt: serverTimestamp()
  });

  message.textContent =
   "রেজিস্ট্রেশন সফল! অ্যাডমিন অনুমোদনের জন্য অপেক্ষা করুন।";
  form.reset();

 } catch (error) {
  console.error(error);
  message.textContent = "সমস্যা: " + error.message;
 } finally {
  button.disabled = false;
 }
});
</script>
</body>
</html>
