
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#070914">
<title>7STARBOYS | Join Community</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#070914;
 --card:rgba(15,23,42,.82);
 --cyan:#00e5ff;
 --purple:#9b4dff;
 --text:#f4f7ff;
 --muted:#9ba8c7;
}

body{
 min-height:100vh;
 background:
 radial-gradient(circle at 15% 20%,#12244b 0,transparent 35%),
 radial-gradient(circle at 85% 80%,#30124b 0,transparent 35%),
 var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
 padding:25px;
 overflow-x:hidden;
}

.orb{
 position:fixed;
 width:250px;height:250px;
 border-radius:50%;
 filter:blur(90px);
 opacity:.22;
 pointer-events:none;
 animation:float 8s infinite alternate;
}
.orb.one{background:var(--cyan);top:5%;left:-100px}
.orb.two{background:var(--purple);bottom:0;right:-100px;animation-delay:2s}

@keyframes float{
 to{transform:translate(50px,45px) scale(1.2)}
}

.topbar{
 max-width:1100px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{
 font-size:23px;
 font-weight:900;
 letter-spacing:2px;
 color:white;
 text-shadow:0 0 15px var(--cyan);
}
.logo span{color:var(--cyan)}

.topbar a{
 color:var(--cyan);
 text-decoration:none;
 border:1px solid #00e5ff66;
 padding:10px 17px;
 border-radius:25px;
}

.main{
 max-width:1000px;
 margin:45px auto;
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:35px;
 align-items:center;
}

.visual{text-align:center;padding:20px}
.visual h2{
 font-size:35px;
 line-height:1.25;
 margin:20px 0 12px;
}
.visual h2 span{color:var(--cyan)}
.visual p{color:var(--muted);line-height:1.8}

.character{
 width:220px;height:220px;margin:auto;position:relative;border:1px solid #00e5ff55;border-radius:50%;
 background:radial-gradient(circle at 50% 35%,#31506e,#101a2d 62%,#090d1b 78%);
 box-shadow:0 0 45px #00e5ff33,inset 0 0 35px #9b4dff22;display:grid;place-items:center;
 animation:float 4s ease-in-out infinite alternate;overflow:hidden;
}
.character:after{content:"";position:absolute;inset:12px;border-radius:50%;border:1px solid #ffffff24;box-shadow:inset 0 0 25px #00e5ff18}
.character svg{width:190px;height:190px;position:relative;z-index:1;filter:drop-shadow(0 10px 18px #0009)}

.ring{
 position:absolute;inset:-13px;
 border:2px dashed #00e5ff88;
 border-radius:50%;
 animation:spin 15s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.card{
 background:var(--card);
 border:1px solid #ffffff20;
 border-radius:22px;
 padding:30px;
 backdrop-filter:blur(18px);
 box-shadow:0 15px 60px #0008,0 0 25px #00e5ff13;
 animation:appear .8s ease;
}
@keyframes appear{
 from{opacity:0;transform:translateY(25px)}
 to{opacity:1;transform:translateY(0)}
}

.card h1{
 text-align:center;
 font-size:27px;
 margin-bottom:8px;
}
.card h1 span{color:var(--cyan)}
.subtitle{
 text-align:center;
 color:var(--muted);
 font-size:14px;
 margin-bottom:25px;
}

label{
 display:block;
 color:#c9d4ef;
 font-size:13px;
 margin:13px 0 7px;
}

input{
 width:100%;
 padding:14px;
 border-radius:10px;
 border:1px solid #ffffff25;
 outline:none;
 background:#080d1b;
 color:white;
 font-size:15px;
 transition:.3s;
}
input:focus{
 border-color:var(--cyan);
 box-shadow:0 0 14px #00e5ff35;
}
input::placeholder{color:#71809f}
input[type="date"]{color-scheme:dark}

button{
 width:100%;
 padding:15px;
 margin-top:22px;
 border:0;
 border-radius:10px;
 color:#06101c;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
 background:linear-gradient(100deg,var(--cyan),#83f5ff);
 box-shadow:0 0 22px #00e5ff45;
 transition:.3s;
}
button:hover{
 transform:translateY(-2px);
 box-shadow:0 0 30px #00e5ff88;
}
button:disabled{opacity:.55;cursor:not-allowed}

#message{
 text-align:center;
 margin-top:16px;
 font-size:14px;
 line-height:1.6;
 overflow-wrap:anywhere;
}

.bottom{
 text-align:center;
 margin-top:20px;
 color:var(--muted);
 font-size:14px;
}
.bottom a{color:var(--cyan);text-decoration:none}

.footer{
 text-align:center;
 color:#65718d;
 font-size:12px;
 margin-top:30px;
}

@media(max-width:750px){
 body{padding:18px}
 .main{grid-template-columns:1fr;margin:30px auto;gap:20px}
 .visual{padding:5px}
 .visual h2{font-size:27px}
 .character{width:165px;height:165px}
 .character svg{width:115px;height:115px}
 .card{padding:23px}
}
</style>
<style id="auth-layout-correction">
body{min-height:100svh!important;background:radial-gradient(ellipse at 12% 8%,rgba(27,104,130,.24),transparent 35%),radial-gradient(ellipse at 90% 90%,rgba(172,133,66,.12),transparent 32%),#070b16!important;padding:18px!important}

@media(max-width:750px){body{padding:12px!important}.topbar{padding:10px 13px!important}.main{display:flex!important;flex-direction:column!important;gap:14px!important;margin:18px auto!important}.visual{min-height:130px!important;padding:16px!important}.visual h2{font-size:25px!important;margin:5px 0 7px!important}.visual p{font-size:13px!important;line-height:1.6!important}.card{padding:23px 18px!important}}
</style>

<body>
<div class="orb one"></div>
<div class="orb two"></div>

<header class="topbar">
 <div class="logo">7<span>STAR</span>BOYS</div>
 <a href="index.html">হোম পেজ</a>
</header>

<main class="main">

<section class="visual">
 <div class="character">
  <div class="ring"></div>
  <div class="cinematic-figure" aria-hidden="true"><span class="figure-light"></span><span class="figure-beam"></span></div>
 </div>

 <h2>WELCOME TO <span>7STARBOYS</span></h2>
 <p>
  একতা, সম্মান ও বন্ধুত্বের বন্ধনে
  আমাদের প্রিমিয়াম কমিউনিটিতে
  তোমাকে স্বাগতম।
 </p>
</section>

<section class="card">
 <h1>CREATE YOUR <span>ACCOUNT</span></h1>
 <p class="subtitle">7STARBOYS Official Member Registration</p>

 <form id="registerForm">

  <label>আপনার পুরো নাম</label>
  <input id="name" type="text"
   placeholder="আপনার নাম লিখুন" required>

  <label>আপনার Gmail</label>
  <input id="email" type="email"
   placeholder="example@gmail.com" required>

  <label>জন্মতারিখ</label>
  <input id="birthDate" type="date" required>

  <label>পাসওয়ার্ড</label>
  <input id="password" type="password"
   placeholder="কমপক্ষে ৬ অক্ষর" minlength="6" required>

  <button id="submitBtn" type="submit">
   CREATE ACCOUNT
  </button>
 </form>

 <p id="message" aria-live="polite"></p>

 <div class="bottom">
  আগে অ্যাকাউন্ট আছে?
  <a href="login.html">লগইন করুন</a>
 </div>
</section>

</main>

<footer class="footer">
 © 2026 7STARBOYS | OFFICIAL COMMUNITY
</footer>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {
 getAuth,
 createUserWithEmailAndPassword,
 setPersistence,
 browserLocalPersistence
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getFirestore,
 doc,
 setDoc,
 serverTimestamp
} from
"https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyCHveS2kKQztiMAPPhXryVNFrElEvehFs4",
 authDomain: "starboys-7539f.firebaseapp.com",
 projectId: "starboys-7539f",
 storageBucket: "starboys-7539f.firebasestorage.app",
 messagingSenderId: "542462403066",
 appId: "1:542462403066:web:a6e204f3402b72cdecc443",
 measurementId: "G-RES9E2QY2N"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const form = document.getElementById("registerForm");
const message = document.getElementById("message");
const button = document.getElementById("submitBtn");

form.addEventListener("submit", async (e) => {
 e.preventDefault();
 if (button.disabled) return;

 button.disabled = true;
 button.textContent = "CREATING ACCOUNT...";
 message.style.color = "#00e5ff";
 message.textContent = "অ্যাকাউন্ট তৈরি হচ্ছে...";

 const name = document.getElementById("name").value.trim();
 const email = document.getElementById("email").value.trim();
 const birthDate = document.getElementById("birthDate").value;
 const password = document.getElementById("password").value;

 try {
  await setPersistence(auth, browserLocalPersistence);

  const result = await createUserWithEmailAndPassword(
   auth, email, password
  );

  await setDoc(doc(db, "members", result.user.uid), {
   name: name,
   email: email,
   birthDate: birthDate,
   status: "pending",
   createdAt: serverTimestamp()
  });

  message.style.color = "#00e5ff";
  message.textContent =
   "রেজিস্ট্রেশন সফল! অ্যাডমিন অনুমোদনের জন্য অপেক্ষা করুন।";

  form.reset();

 } catch (error) {
  console.error(error);

  message.style.color = "#ff647c";

  const errors = {
   "auth/email-already-in-use": "এই ইমেইল দিয়ে আগে অ্যাকাউন্ট খোলা হয়েছে।",
   "auth/invalid-email": "সঠিক ইমেইল ঠিকানা লিখুন।",
   "auth/weak-password": "আরও শক্তিশালী পাসওয়ার্ড দিন।",
   "auth/network-request-failed": "ইন্টারনেট সংযোগ পরীক্ষা করুন।",
   "permission-denied": "ডাটাবেজ অনুমতি পরীক্ষা করতে হবে।"
  };

  message.textContent =
   errors[error.code] || "সমস্যা হয়েছে: " + error.message;

 } finally {
  button.disabled = false;
  button.textContent = "CREATE ACCOUNT";
 }
});
</script>

</body>
