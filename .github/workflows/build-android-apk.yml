name: Build 7STARBOYS Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android-apk.yml"
      - "app-icon.svg"
      - "index.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
          cache-disabled: true

      - name: Create Android app project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/sevenstarboys/app
          mkdir -p app/src/main/res/values app/src/main/res/drawable-nodpi
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "SevenStarBoys"
          include(":app")
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.sevenstarboys.app'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.sevenstarboys.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <application android:label="7STARBOYS" android:icon="@drawable/ic_launcher" android:roundIcon="@drawable/ic_launcher" android:theme="@style/AppTheme" android:usesCleartextTraffic="false">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          curl -fsSL "https://raw.githubusercontent.com/blackhunterbd756-del/7starboys/main/app-icon.svg" -o app-icon.svg
          rsvg-convert -w 512 -h 512 app-icon.svg -o app/src/main/res/drawable-nodpi/ic_launcher.png
          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="@android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#C9A227</item>
                  <item name="android:navigationBarColor">#080511</item>
                  <item name="android:statusBarColor">#080511</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF
          cat > app/src/main/java/com/sevenstarboys/app/MainActivity.java <<'EOF'
          package com.sevenstarboys.app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.*;
          import android.content.Intent;
          import android.net.Uri;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> uploadCallback;
              private static final int FILE_PICKER = 1001;

              @Override public void onCreate(Bundle state) {
                  super.onCreate(state);
                  getWindow().setStatusBarColor(android.graphics.Color.rgb(8,5,17));
                  getWindow().setNavigationBarColor(android.graphics.Color.rgb(8,5,17));
                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.getSettings().setAllowFileAccess(true);
                  webView.getSettings().setMediaPlaybackRequiresUserGesture(false);
                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (uploadCallback != null) uploadCallback.onReceiveValue(null);
                          uploadCallback = callback;
                          Intent intent = params.createIntent();
                          try { startActivityForResult(intent, FILE_PICKER); }
                          catch (Exception e) { uploadCallback = null; return false; }
                          return true;
                      }
                  });
                  setContentView(webView);
                  webView.loadUrl("https://blackhunterbd756-del.github.io/7starboys/");
              }

              @Override protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == FILE_PICKER && uploadCallback != null) {
                      Uri[] results = WebChromeClient.FileChooserParams.parseResult(resultCode, data);
                      uploadCallback.onReceiveValue(results);
                      uploadCallback = null;
                  }
              }

              @Override public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          EOF
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/7STARBOYS.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 7STARBOYS-Android-APK
          path: app/build/outputs/apk/debug/7STARBOYS.apk
          if-no-files-found: error

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: 7starboys-latest
          name: 7STARBOYS Android App
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/debug/7STARBOYS.apk
          overwrite_files: true
          make_latest: true
