
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080511">
<title>7STARBOYS - Members</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#070914;
 color:white;
 font-family:Arial,sans-serif;
}

header{
 background:#10152a;
 padding:24px 15px;
 text-align:center;
 border-bottom:1px solid #00e5ff;
 box-shadow:0 5px 25px #00e5ff15;
}

header h2{
 color:#00e5ff;
 margin:0;
 letter-spacing:3px;
}

header p{color:#aaa;margin-bottom:0}

main{max-width:950px;margin:auto;padding:20px}

h3{color:#00e5ff}

#message{
 color:#00e5ff;
 text-align:center;
 padding:18px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:18px;
}

.card{
 background:linear-gradient(145deg,#121a30,#0b1020);
 border:1px solid #263b60;
 border-radius:16px;
 padding:22px;
 text-align:center;
 transition:.3s;
}

.card:hover{
 border-color:#00e5ff;
 box-shadow:0 0 22px #00e5ff20;
 transform:translateY(-4px);
}

.card img,.avatar{
 width:105px;
 height:105px;
 border-radius:50%;
 border:3px solid #00e5ff;
 object-fit:cover;
 margin:auto;
}

.avatar{
 display:grid;
 place-items:center;
 background:#242d49;
 font-size:34px;
 font-weight:bold;
 color:#00e5ff;
}

.name{
 font-size:19px;
 font-weight:bold;
 margin-top:14px;
}

.designation{
 color:#bd9cff;
 margin-top:8px;
}

button{
 background:linear-gradient(90deg,#00bcd4,#7544ff);
 color:white;
 border:0;
 padding:11px 16px;
 border-radius:8px;
 cursor:pointer;
 margin:5px;
 font-weight:bold;
}

button:hover{opacity:.85}

.details{
 background:#080e1d;
 border:1px solid #34476b;
 border-radius:12px;
 padding:15px;
 margin-top:12px;
 text-align:left;
 line-height:2;
}

.details h3{text-align:center}

.hidden{display:none}

.top-buttons{
 text-align:center;
 margin-bottom:20px;
}
</style>
    <link rel="stylesheet" href="club-design.css?v=20261117-purplegold3">
</head>

<body>

<header>
<h2>7STARBOYS</h2>
<p>OFFICIAL COMMUNITY · MEMBERS</p>
</header>

<main>

<h3>আমাদের সদস্যবৃন্দ</h3>

<div class="top-buttons">
<button id="refresh">তালিকা Refresh</button>
<button id="back">Dashboard</button>
</div>

<div id="message">সদস্যদের তালিকা লোড হচ্ছে...</div>
<div class="grid" id="members"></div>

</main>

<script type="module">

import {initializeApp}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";

import {getAuth,onAuthStateChanged}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";

import {
 getFirestore,doc,getDoc,getDocs,collection
}
from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig={
 apiKey:"AIzaSyCHveS2kKQztiMAPPhXryVNFrElEvehFs4",
 authDomain:"starboys-7539f.firebaseapp.com",
 projectId:"starboys-7539f",
 storageBucket:"starboys-7539f.firebasestorage.app",
 messagingSenderId:"542462403066",
 appId:"1:542462403066:web:a6e204f3402b72cdecc443",
 measurementId:"G-RES9E2QY2N"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

const message=document.getElementById("message");
const membersBox=document.getElementById("members");

let currentUser=null;
let myProfile=null;

async function loadMembers(){

 message.textContent="সদস্যদের তালিকা লোড হচ্ছে...";
 membersBox.innerHTML="";

 try{

  const result=await getDocs(
   collection(db,"publicProfiles")
  );

  if(result.empty){
   message.textContent="এখনো কোনো সদস্যের প্রোফাইল যোগ করা হয়নি।";
   return;
  }

  result.forEach(item=>{

   const data=item.data();
   const uid=item.id;

   const card=document.createElement("div");
   card.className="card";

   // Profile Photo

   if(data.photoURL){

    const img=document.createElement("img");
    img.src=data.photoURL;
    img.alt="সদস্যের ছবি";
    card.appendChild(img);

   }else{

    const avatar=document.createElement("div");
    avatar.className="avatar";
    avatar.textContent=(data.name||"?").charAt(0);
    card.appendChild(avatar);

   }

   // Member Name

   const name=document.createElement("div");
   name.className="name";
   name.textContent=data.name||"নাম নেই";

   // Designation

   const designation=document.createElement("div");
   designation.className="designation";
   designation.textContent=data.designation||"সদস্য";

   // Details Section

   const details=document.createElement("div");
   details.className="details hidden";

   const title=document.createElement("h3");
   title.textContent="সদস্যের বিস্তারিত";
   details.appendChild(title);

   const nameInfo=document.createElement("div");
   nameInfo.textContent="নাম: "+(data.name||"নাম নেই");
   details.appendChild(nameInfo);

   const postInfo=document.createElement("div");
   postInfo.textContent="পদবি: "+(data.designation||"সদস্য");
   details.appendChild(postInfo);

   const dobInfo=document.createElement("div");

   if(uid===currentUser.uid){
    dobInfo.textContent=
     "জন্ম তারিখ: "+(myProfile.birthDate||"দেওয়া নেই");
   }else{
    dobInfo.textContent="জন্ম তারিখ: ব্যক্তিগত";
   }

   details.appendChild(dobInfo);

   // Details Button

   const detailsButton=document.createElement("button");
   detailsButton.textContent="বিস্তারিত দেখুন";

   detailsButton.onclick=()=>{

    details.classList.toggle("hidden");

    detailsButton.textContent=
     details.classList.contains("hidden")
     ?"বিস্তারিত দেখুন"
     :"বন্ধ করুন";

   };

   // Profile Button

   const profileButton=document.createElement("button");
   profileButton.textContent="প্রোফাইল দেখুন";

   profileButton.onclick=()=>{
    location.href="profile.html?uid="+encodeURIComponent(uid);
   };

   card.appendChild(name);
   card.appendChild(designation);
   card.appendChild(detailsButton);
   card.appendChild(profileButton);
   card.appendChild(details);

   membersBox.appendChild(card);

  });

  message.textContent="মোট সদস্য: "+result.size;

 }catch(error){

  console.error(error);
  message.textContent="তালিকা লোড হয়নি: "+error.message;

 }

}

// Authentication Check

onAuthStateChanged(auth,async user=>{

 if(!user){
  location.replace("login.html");
  return;
 }

 currentUser=user;

 try{

  const snap=await getDoc(
   doc(db,"members",user.uid)
  );

  if(!snap.exists()||snap.data().status!=="approved"){
   location.replace("login.html");
   return;
  }

  myProfile=snap.data();

  await loadMembers();

 }catch(error){

  console.error(error);
  message.textContent="যাচাই করা যায়নি: "+error.message;

 }

});

document.getElementById("refresh").onclick=loadMembers;

document.getElementById("back").onclick=()=>{
 location.href="member.html";
};

</script>

</body>
</html>
